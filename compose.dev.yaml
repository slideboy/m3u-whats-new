services:
  xtream-whats-new-dev:
    build:
      context: .
      dockerfile: Dockerfile
    image: xtream-whats-new:dev
    container_name: xtream-whats-new-dev
    restart: unless-stopped
    ports:
      - "36401:36401"
    env_file:
      - .env.dev
    volumes:
      - /opt/appdata/xtream-whats-new-dev/data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:36401/', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
